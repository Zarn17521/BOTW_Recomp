name: Merge BOTW Base + Update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Download Base and Update
        env:
          BASE_URL: ${{ secrets.BOTW_BASE_URL }}
          UPDATE_URL: ${{ secrets.BOTW_UPDATE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_URL" || -z "$UPDATE_URL" ]]; then
            echo "Missing Google Drive URL secrets"
            exit 1
          fi
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install gdown
          "$RUNNER_TEMP/venv/bin/gdown" --fuzzy "$BASE_URL" -O "$RUNNER_TEMP/base.zip"
          "$RUNNER_TEMP/venv/bin/gdown" --fuzzy "$UPDATE_URL" -O "$RUNNER_TEMP/update.zip"

      - name: Extract and merge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base" "$RUNNER_TEMP/update"
          unzip -q "$RUNNER_TEMP/base.zip" -d "$RUNNER_TEMP/base"
          rm "$RUNNER_TEMP/base.zip"
          unzip -q "$RUNNER_TEMP/update.zip" -d "$RUNNER_TEMP/update"
          rm "$RUNNER_TEMP/update.zip"

          find_root() {
            local f
            f=$(find "$1" -type f -path '*/code/U-King.rpx' -print -quit)
            test -n "$f" || return 1
            dirname "$(dirname "$f")"
          }

          BASE=$(find_root "$RUNNER_TEMP/base")
          UPDATE=$(find_root "$RUNNER_TEMP/update")

          for d in code content meta; do
            test -d "$BASE/$d"
            test -d "$UPDATE/$d"
            cp -a "$UPDATE/$d/." "$BASE/$d/"
          done

          echo "BASE=$BASE" >> "$GITHUB_ENV"

      - name: Verify U-King.rpx
        run: |
          EXPECTED="ba58da5b95ce929e005d058ceb08b9b2788d1ab2bbc8a6c189bbadca0bb34d30"
          ACTUAL=$(sha256sum "$BASE/code/U-King.rpx" | awk '{print $1}')
          echo "Expected: $EXPECTED"
          echo "Actual: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Create merged ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/output"
          mv "$BASE" "$RUNNER_TEMP/output/game"
          cd "$RUNNER_TEMP/output"
          zip -qry -0 "$GITHUB_WORKSPACE/BOTW-WiiU-USA-v208-merged.zip" game

      - name: Upload merged game
        uses: actions/upload-artifact@v4
        with:
          name: BOTW-WiiU-USA-v208-merged
          path: BOTW-WiiU-USA-v208-merged.zip
          compression-level: 0
          retention-days: 1
