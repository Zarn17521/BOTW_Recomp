
name: Merge BOTW Base + Update

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip
          python -m pip install --upgrade gdown

      - name: Download Base and Update
        env:
          BASE_URL: ${{ secrets.BOTW_BASE_URL }}
          UPDATE_URL: ${{ secrets.BOTW_UPDATE_URL }}
        run: |
          set -euo pipefail

          if [ -z "$BASE_URL" ] || [ -z "$UPDATE_URL" ]; then
            echo "ERROR: BOTW_BASE_URL or BOTW_UPDATE_URL secret is missing"
            exit 1
          fi

          mkdir -p /tmp/base /tmp/update

          gdown "$BASE_URL" -O /tmp/base.zip
          gdown "$UPDATE_URL" -O /tmp/update.zip

          ls -lh /tmp/base.zip /tmp/update.zip

      - name: Extract and merge
        run: |
          set -euo pipefail

          mkdir -p /tmp/base_extract /tmp/update_extract

          unzip -q /tmp/base.zip -d /tmp/base_extract
          unzip -q /tmp/update.zip -d /tmp/update_extract

          BASE_RPX=$(find /tmp/base_extract -type f -path '*/code/U-King.rpx' -print -quit)
          UPDATE_RPX=$(find /tmp/update_extract -type f -path '*/code/U-King.rpx' -print -quit)

          if [ -z "$BASE_RPX" ]; then
            echo "ERROR: Base U-King.rpx not found"
            exit 1
          fi

          if [ -z "$UPDATE_RPX" ]; then
            echo "ERROR: Update U-King.rpx not found"
            exit 1
          fi

          BASE_GAME=$(dirname "$(dirname "$BASE_RPX")")
          UPDATE_GAME=$(dirname "$(dirname "$UPDATE_RPX")")

          echo "Base folder: $BASE_GAME"
          echo "Update folder: $UPDATE_GAME"

          for d in code content meta; do
            if [ ! -d "$BASE_GAME/$d" ] || [ ! -d "$UPDATE_GAME/$d" ]; then
              echo "ERROR: Missing $d folder"
              exit 1
            fi
          done

          for d in code content meta; do
            cp -a "$UPDATE_GAME/$d/." "$BASE_GAME/$d/"
          done

          mkdir -p output
          cp -a "$BASE_GAME" output/game

      - name: Verify merged game
        run: |
          set -euo pipefail

          RPX="output/game/code/U-King.rpx"

          if [ ! -f "$RPX" ]; then
            echo "ERROR: Merged U-King.rpx missing"
            exit 1
          fi

          sha256sum "$RPX"

          EXPECTED="ba58da5b95ce929e005d058ceb08b9b2788d1ab2bbc8a6c189bbadca0bb34d30"
          ACTUAL=$(sha256sum "$RPX" | awk '{print $1}')

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: U-King.rpx SHA256 does not match expected value"
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

          echo "BOTW merged game verification passed."

      - name: Create merged ZIP
        run: |
          set -euo pipefail

          cd output
          zip -qry -0 BOTW-WiiU-USA-v208-merged.zip game

          ls -lh BOTW-WiiU-USA-v208-merged.zip

      - name: Upload merged game
        uses: actions/upload-artifact@v4
        with:
          name: BOTW-WiiU-USA-v208-merged
          path: output/BOTW-WiiU-USA-v208-merged.zip
          if-no-files-found: error
          retention-days: 1
